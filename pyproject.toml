[project]
name = "tripo-fleet"
version = "0.1.0"
description = "Batch-generate the sci-fi traffic fleet with Tripo's multiview API and normalise it to the GeometryForge fleet contract"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "pygltflib>=1.16",
    "pillow>=10.0",
]

[project.scripts]
tripo-fleet = "tripo_fleet.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tripo_fleet"]

[tool.pytest.ini_options]
testpaths = ["tests"]
